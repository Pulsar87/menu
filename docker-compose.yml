version: '3.8'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: menu_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menuapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menuapp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-menuapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menuapp} -d ${POSTGRES_DB:-menuapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - menu_network

  # Redis 7 Cache & Queue (Upstash-compatible)
  redis:
    image: redis:7-alpine
    container_name: menu_app_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - menu_network

  # Next.js App (Node.js 22 + TypeScript)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menu_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-menuapp}:${POSTGRES_PASSWORD:-menuapp_secret}@postgres:5432/${POSTGRES_DB:-menuapp}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - menu_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  menu_network:
    driver: bridge
